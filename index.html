<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E76F51">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GDL Cultural">
<link rel="manifest" href="/manifest.json">
<title>GDL Cultural — Museos y Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #E76F51; --primary-dark: #C75540; --primary-container: #FFEDE5;
    --secondary: #F4A261; --secondary-container: #FFF4E0;
    --tertiary: #2A9D8F; --tertiary-container: #E0F5F1;
    --accent: #E63946; --accent-container: #FFE5E7;
    --bg: #FDFCFA; --surface: #FFFFFF; --surface-2: #F7F5F2; --surface-3: #EFEBE6;
    --outline: #E7E2DC; --outline-strong: #D4CCC2;
    --text: #1A1614; --text-2: #57534E; --text-3: #A8A29E;
    --shadow-1: 0 1px 2px rgba(26, 22, 20, 0.06), 0 1px 3px rgba(26, 22, 20, 0.08);
    --shadow-2: 0 2px 6px rgba(26, 22, 20, 0.06), 0 4px 12px rgba(26, 22, 20, 0.08);
    --shadow-3: 0 8px 24px rgba(26, 22, 20, 0.10), 0 4px 8px rgba(26, 22, 20, 0.06);
    --shadow-4: 0 20px 48px rgba(26, 22, 20, 0.14);
    --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 24px; --r-xl: 28px; --r-full: 999px;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ease-emphasized: cubic-bezier(0.2, 0, 0, 1); --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --z-map: 1; --z-chips: 900; --z-header: 1000; --z-submenu: 1500;
    --z-overlay: 1900; --z-sidebar: 2000; --z-banner: 2400; --z-toast: 3000;
  }
  html[data-theme="dark"] {
    --primary: #F08A6C; --primary-dark: #E76F51; --primary-container: #3A241D;
    --secondary: #F4A261; --secondary-container: #3D2E1A;
    --tertiary: #4DB6AC; --tertiary-container: #1A2E2B;
    --accent: #EF5350; --accent-container: #3A1E1F;
    --bg: #121212; --surface: #1E1E1E; --surface-2: #252525; --surface-3: #2E2E2E;
    --outline: #333333; --outline-strong: #4A4A4A;
    --text: #F5F5F5; --text-2: #B0B0B0; --text-3: #808080;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
    --shadow-2: 0 2px 6px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.35);
    --shadow-3: 0 8px 24px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
    --shadow-4: 0 20px 48px rgba(0,0,0,0.6);
  }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; height: 100vh; height: 100dvh; position: fixed; width: 100%; overscroll-behavior: none; transition: background .3s var(--ease-standard), color .3s var(--ease-standard); }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; user-select: none; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .ms.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
  
  #map { position: absolute; inset: 0; z-index: var(--z-map); background: var(--surface-2); }
  html[data-theme="dark"] #map { filter: invert(0.92) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
  
  .header {
    position: absolute; top: calc(16px + var(--safe-top));
    left: 16px; right: 16px; z-index: var(--z-header);
    display: flex; align-items: center; gap: 10px;
    pointer-events: none;
    transition: left .4s var(--ease-emphasized);
  }
  .search-pill {
    flex: 1; height: 56px; background: var(--surface);
    border-radius: var(--r-full); padding: 0 20px;
    box-shadow: var(--shadow-3);
    display: flex; align-items: center; gap: 14px;
    pointer-events: auto; cursor: pointer;
    transition: transform .2s var(--ease-standard), box-shadow .2s;
    border: 1px solid var(--outline);
  }
  .search-pill:active { transform: scale(0.985); }
  .search-pill .ms { color: var(--text-3); }
  .search-pill span { color: var(--text-2); font-size: 15px; font-weight: 500; }
  .icon-btn {
    width: 56px; height: 56px; border-radius: var(--r-full);
    background: var(--surface); border: 1px solid var(--outline);
    display: grid; place-items: center;
    box-shadow: var(--shadow-3); cursor: pointer;
    color: var(--text); pointer-events: auto;
    transition: transform .2s var(--ease-standard), background .2s, color .2s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { transform: scale(0.92); }
  .header-actions { display: flex; gap: 8px; pointer-events: auto; }
  
  .main-categories {
    position: absolute; right: 16px; top: 50%;
    transform: translateY(-50%); z-index: var(--z-chips);
    display: flex; flex-direction: column; gap: 12px;
    pointer-events: auto;
  }
  .cat-btn {
    width: 56px; height: 56px; border-radius: var(--r-lg);
    background: var(--surface); border: 1px solid var(--outline);
    display: grid; place-items: center;
    box-shadow: var(--shadow-3); cursor: pointer;
    color: var(--text); position: relative;
    transition: transform .25s var(--ease-spring), background .2s, color .2s, border-color .2s;
  }
  .cat-btn .ms { font-size: 26px; }
  .cat-btn:hover { transform: scale(1.05); }
  .cat-btn:active { transform: scale(0.92); }
  .cat-btn .badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: var(--r-full);
    background: var(--primary); color: #FFFFFF;
    font-size: 11px; font-weight: 800;
    display: grid; place-items: center;
    border: 2px solid var(--surface);
    opacity: 0; transition: opacity .2s, transform .2s;
  }
  .cat-btn .badge.show { opacity: 1; }
  
  .submenu {
    position: absolute; right: 84px; top: 50%;
    transform: translateY(-50%);
    z-index: var(--z-submenu);
    background: var(--surface); border: 1px solid var(--outline);
    border-radius: var(--r-lg); box-shadow: var(--shadow-4);
    padding: 12px; min-width: 240px; max-width: 320px;
    opacity: 0; visibility: hidden;
    transform: translateY(-50%) translateX(20px) scale(0.95);
    transform-origin: right center;
    transition: all .3s var(--ease-spring);
    pointer-events: none;
  }
  .submenu.open {
    opacity: 1; visibility: visible;
    transform: translateY(-50%) translateX(0) scale(1);
    pointer-events: auto;
  }
  .submenu-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px 12px; border-bottom: 1px solid var(--outline); margin-bottom: 8px;
  }
  .submenu-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--text); display: flex; align-items: center; gap: 8px;
  }
  .submenu-title .ms { font-size: 22px; color: var(--submenu-color, var(--primary)); }
  .submenu-close {
    width: 32px; height: 32px; border-radius: var(--r-full);
    border: none; background: transparent; color: var(--text-2);
    display: grid; place-items: center; cursor: pointer;
    transition: background .2s;
  }
  .submenu-close:hover { background: var(--surface-2); color: var(--text); }
  .submenu-close .ms { font-size: 20px; }
  .submenu-options {
    display: flex; flex-direction: column; gap: 4px;
    max-height: 400px; overflow-y: auto;
  }
  .submenu-option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border: none; background: transparent;
    border-radius: var(--r-sm); cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--text); transition: background .15s, transform .15s;
    text-align: left; width: 100%;
    opacity: 0; transform: translateX(10px);
    animation: submenuItemIn .3s var(--ease-spring) forwards;
  }
  @keyframes submenuItemIn { to { opacity: 1; transform: translateX(0); } }
  .submenu-option:hover { background: var(--surface-2); }
  .submenu-option:active { transform: scale(0.98); }
  .submenu-option.active {
    background: var(--option-bg, var(--primary-container));
    color: var(--option-color, var(--primary-dark));
  }
  .submenu-option .ms {
    font-size: 22px; color: var(--text-2); flex-shrink: 0;
    transition: color .2s;
  }
  .submenu-option.active .ms {
    color: var(--option-color, var(--primary));
    font-variation-settings: 'FILL' 1, 'wght' 500;
  }
  .submenu-option .check {
    margin-left: auto; font-size: 20px;
    color: var(--option-color, var(--primary));
    opacity: 0; transition: opacity .2s;
  }
  .submenu-option.active .check { opacity: 1; }
  
  /* SIDEBAR — 100% del contenido de resultados */
  .sidebar {
    position: absolute; top: 0; left: 0;
    width: 380px; height: 100%;
    background: var(--surface);
    box-shadow: var(--shadow-4);
    z-index: var(--z-sidebar);
    transform: translateX(-100%);
    transition: transform .4s var(--ease-emphasized), background .3s;
    display: flex; flex-direction: column;
    padding-top: var(--safe-top);
    border-right: 1px solid var(--outline);
  }
  .sidebar.open { transform: translateX(0); }
  
  .sidebar-top {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--outline);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand-logo {
    width: 44px; height: 44px; border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: grid; place-items: center; color: #FFFFFF;
    box-shadow: 0 4px 12px rgba(231, 111, 81, 0.3);
    flex-shrink: 0;
  }
  .brand-text { flex: 1; min-width: 0; }
  .brand-text h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); line-height: 1.1; }
  .brand-text p { font-size: 12px; color: var(--text-3); font-weight: 500; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .close-btn {
    width: 40px; height: 40px; border-radius: var(--r-full);
    border: none; background: transparent; color: var(--text-2);
    display: grid; place-items: center; cursor: pointer;
    transition: background .2s, color .2s; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--surface-2); color: var(--text); }
  
  .lang-selector {
    display: flex;
    background: var(--surface-2);
    border-radius: var(--r-md);
    padding: 4px;
    border: 1px solid var(--outline);
    margin-bottom: 12px;
  }
  .lang-option {
    flex: 1;
    height: 40px;
    border: none;
    background: transparent;
    border-radius: var(--r-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all .2s;
  }
  .lang-option:hover { color: var(--text); }
  .lang-option.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow-2);
  }
  .lang-option .ms { font-size: 18px; }
  
  .search-field {
    display: flex; align-items: center;
    height: 52px; background: var(--surface-2);
    border-radius: var(--r-md);
    padding: 0 16px; gap: 12px;
    border: 2px solid transparent;
    transition: all .2s; margin-bottom: 12px;
  }
  .search-field:focus-within { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 4px rgba(231, 111, 81, 0.12); }
  .search-field .ms { color: var(--text-3); flex-shrink: 0; }
  .search-field input { flex: 1; background: transparent; border: none; outline: none; font-family: inherit; font-size: 15px; font-weight: 500; color: var(--text); min-width: 0; }
  .search-field input::placeholder { color: var(--text-3); font-weight: 400; }
  
  .gps-button {
    width: 100%; height: 52px;
    border: none; border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #FFFFFF;
    font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 4px 14px rgba(231, 111, 81, 0.3);
    transition: transform .2s;
  }
  .gps-button:active { transform: scale(0.97); }
  .gps-button.tracking { background: linear-gradient(135deg, var(--tertiary) 0%, #1E7A6F 100%); }
  
  .events-scroll {
    flex: 1; overflow-y: auto;
    padding: 16px 16px 100px 16px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .events-scroll::-webkit-scrollbar { width: 6px; }
  .events-scroll::-webkit-scrollbar-thumb { background: var(--outline-strong); border-radius: 3px; }
  
  .section-label {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11px; font-weight: 800;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 4px 0;
  }
  
  .event-card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--r-lg);
    padding: 16px;
    display: flex; gap: 14px;
    cursor: pointer;
    transition: all .22s var(--ease-standard);
    position: relative; overflow: hidden;
    min-height: 88px;
    animation: fadeInUp .3s var(--ease-emphasized) backwards;
  }
  .event-card::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--card-color, var(--primary));
    opacity: 0; transition: opacity .22s;
  }
  .event-card:hover { border-color: var(--outline-strong); box-shadow: var(--shadow-2); transform: translateY(-2px); }
  .event-card:hover::before { opacity: 1; }
  .event-card:active { transform: scale(0.985) translateY(0); }
  .event-icon-box {
    width: 52px; height: 52px; border-radius: var(--r-md);
    display: grid; place-items: center; flex-shrink: 0;
    background: var(--card-bg, var(--primary-container));
    color: var(--card-color, var(--primary));
  }
  .event-icon-box .ms { font-size: 26px; font-variation-settings: 'FILL' 1; }
  .event-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .event-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.015em; line-height: 1.3;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .event-venue {
    font-size: 13px; color: var(--text-2); font-weight: 500;
    display: flex; align-items: center; gap: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .event-venue .ms { font-size: 14px; color: var(--text-3); flex-shrink: 0; }
  .event-footer { display: flex; align-items: center; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .event-age-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 800;
    padding: 3px 8px; border-radius: var(--r-full);
    background: var(--age-bg, #E0F5F1);
    color: var(--age-color, #2A9D8F);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .event-age-tag .ms { font-size: 12px; }
  .event-rating {
    font-size: 12px; color: var(--text-3); font-weight: 600;
    margin-left: auto; display: flex; align-items: center; gap: 2px;
  }
  .event-rating .ms { font-size: 14px; color: #F4A261; }
  
  .empty-state {
    text-align: center; padding: 60px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .empty-state .ms { font-size: 56px; color: var(--outline-strong); }
  .empty-state h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); }
  .empty-state p { font-size: 13px; color: var(--text-3); max-width: 240px; line-height: 1.5; }
  
  .overlay {
    position: absolute; inset: 0;
    background: rgba(26, 22, 20, 0.4);
    z-index: var(--z-overlay);
    opacity: 0; pointer-events: none;
    transition: opacity .3s var(--ease-standard);
    backdrop-filter: blur(4px);
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  
  /* SISTEMA DE TOASTS EN COLA — nunca se encima */
  .toast-container {
    position: absolute;
    bottom: calc(24px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: var(--z-toast);
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
    pointer-events: none;
    max-width: calc(100% - 32px);
    align-items: center;
  }
  .toast {
    background: var(--text); color: var(--surface);
    padding: 14px 22px; border-radius: var(--r-full);
    font-size: 14px; font-weight: 600;
    box-shadow: var(--shadow-4);
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    animation: toastIn .3s var(--ease-spring) forwards;
    pointer-events: auto;
    max-width: 100%;
  }
  .toast.leaving {
    animation: toastOut .3s var(--ease-standard) forwards;
  }
  @keyframes toastIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(20px) scale(0.95); }
  }
  .toast .ms { font-size: 20px; flex-shrink: 0; }
  .toast span:not(.ms) { overflow: hidden; text-overflow: ellipsis; }
  
  /* PWA INSTALL BANNER con botón X — se auto-oculta si hay toasts */
  .install-banner {
    position: absolute;
    bottom: calc(24px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(200%);
    z-index: var(--z-banner);
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-4);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    transition: transform .4s var(--ease-spring), opacity .3s;
    pointer-events: none;
    max-width: calc(100% - 32px);
    width: 440px;
    opacity: 0;
  }
  .install-banner.show {
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
    opacity: 1;
  }
  .install-banner.hidden-by-toast {
    transform: translateX(-50%) translateY(calc(100% + 32px));
    opacity: 0;
    pointer-events: none;
  }
  .install-banner .ms.install-icon { color: var(--primary); font-size: 28px; flex-shrink: 0; }
  .install-banner-text { flex: 1; min-width: 0; }
  .install-banner-text strong { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 800; color: var(--text); display: block; }
  .install-banner-text span { font-size: 12px; color: var(--text-3); display: block; margin-top: 2px; }
  .install-banner-btn {
    padding: 10px 18px; border: none; border-radius: var(--r-full);
    background: var(--primary); color: #FFFFFF;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: transform .2s, background .2s;
    flex-shrink: 0;
  }
  .install-banner-btn:hover { background: var(--primary-dark); }
  .install-banner-btn:active { transform: scale(0.95); }
  .install-banner-close {
    width: 32px; height: 32px;
    border-radius: var(--r-full);
    border: none; background: transparent;
    color: var(--text-3);
    display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0;
    transition: background .2s, color .2s;
  }
  .install-banner-close:hover { background: var(--surface-2); color: var(--text); }
  .install-banner-close .ms { font-size: 18px; }
  
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  
  /* RESPONSIVE — MÓVIL */
  @media (max-width: 1199px) {
    .main-categories {
      right: 12px;
      top: auto;
      bottom: calc(160px + var(--safe-bottom));
      transform: none;
      flex-direction: column;
    }
    .cat-btn { width: 52px; height: 52px; }
    .submenu {
      right: 76px;
      top: auto;
      bottom: calc(160px + var(--safe-bottom));

function categorizeEventByAge(event) {
  const text = ((event.title || '') + ' ' + (event.description || '') + ' ' + (event.venue || '')).toLowerCase();
  const patterns = {
    family: /\b(familiar|familia|family|niños|kids|infantil|todos|all ages|para toda la familia|recreativo|parque|zoo|circo|festival|taller|obra|teatro)\b/i,

    kids:   /\b(niño|niña|kids|child|infantil|cuentacuentos|taller infantil|manualidades|pintura|danza infantil|teatro infantil|bebé|baby)\b/i
  };
  if (patterns.family.test(text)) return AGE_CATEGORIES.family;
  if (patterns.kids.test(text)) return AGE_CATEGORIES.kids;
  if (patterns.teens.test(text)) return AGE_CATEGORIES.teens;
  if (patterns.adults.test(text)) return AGE_CATEGORIES.adults;
  return AGE_CATEGORIES.all;
}
function getAgeCategoryKey(event) {
  const cat = categorizeEventByAge(event);

/* ============================================

   ============================================ */
const toastQueue = [];
let toastActive = 0;
const MAX_VISIBLE_TOASTS = 2;

function showToast(icon, msg) {
  toastQueue.push({ icon, msg });
  processToastQueue();
}

function processToastQueue() {
  if (toastActive >= MAX_VISIBLE_TOASTS) return;
  if (toastQueue.length === 0) return;
  
  const { icon, msg } = toastQueue.shift();
  toastActive++;
  
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span class="ms fill">${icon}</span><span>${msg}</span>`;
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('leaving');
    setTimeout(() => {
      toast.remove();
      toastActive--;
      processToastQueue();
    }, 300);
  }, 2200);
}

function checkIfPWAInstalled() {

                       window.navigator.standalone === true ||
                       document.referrer.includes('android-app://');
  isPWAInstalled = isStandalone;
  if (isStandalone) {
    document.getElementById('installBanner').classList.remove('show');
  }
  return isStandalone;
}

  catch (e) { console.warn('PlacesService no disponible:', e); placesApiAvailable = false; }

  /* ============================================
     EVENTOS DEL MAPA — CIERRE AUTOMÁTICO DEL SIDEBAR
     ============================================ */

/* ============================================
   BÚSQUEDA
   ============================================ */
async function searchEverything() {
  if (Date.now() - lastSearchTime < SEARCH_DEBOUNCE_MS) return;
  lastSearchTime = Date.now();
  clearMarkers();
  if (infoWindow) infoWindow.close();
  allPlaces = []; allEvents = []; unifiedResults = [];

  const [placesRes, tmRes, ebRes] = await Promise.allSettled([
    searchPlacesPromise(), searchTicketmasterPromise(), searchEventbritePromise()
  ]);

  if (placesRes.status === 'fulfilled') allPlaces = placesRes.value || [];
  if (tmRes.status === 'fulfilled') allEvents = allEvents.concat(tmRes.value || []);
  if (ebRes.status === 'fulfilled') allEvents = allEvents.concat(ebRes.value || []);

  allEvents = deduplicateEvents(allEvents);
  applyFilters();
  updateBadges();
}
function applyFilters() {
  let eventsFiltered = allEvents;
  if (currentAudience !== 'all') eventsFiltered = allEvents.filter(e => getAgeCategoryKey(e) === currentAudience);
  unifiedResults = [...eventsFiltered, ...allPlaces];
  renderMarkersForAll();
  renderUnifiedList();
}
function updateBadges() {
  Object.keys(AGE_CATEGORIES).forEach(key => {
    const badge = document.querySelector(`.cat-btn[data-audience="${key}"] .badge`);
    if (badge) {
      let count = key === 'all' ? allEvents.length : allEvents.filter(e => getAgeCategoryKey(e) === key).length;
      badge.textContent = count;
      badge.classList.toggle('show', count > 0);
    }
  });
}
function searchPlacesPromise() {
  return new Promise((resolve) => {
    if (!placesService || !placesApiAvailable) return resolve([]);
    const category = CATEGORIES[currentCategory];
    const request = { location: map.getCenter(), radius: DEFAULT_RADIUS, type: category.type };
    if (currentSearch) request.keyword = currentSearch;
    const timeout = setTimeout(() => resolve([]), 8000);
    try {
      placesService.nearbySearch(request, (results, status) => {
        clearTimeout(timeout);
        if (status === google.maps.places.PlacesServiceStatus.OK && results) resolve(results);
        else if (status === 'REQUEST_DENIED' || status === 'OVER_QUERY_LIMIT') { placesApiAvailable = false; resolve([]); }
        else resolve([]);
      });
    } catch (err) { clearTimeout(timeout); resolve([]); }
  });
}
function searchTicketmasterPromise() {
  return new Promise(async (resolve) => {
    try {
      const center = map.getCenter();
      const url = `https://app.ticketmaster.com/discovery/v2/events.json?apikey=${API_KEYS.ticketmaster}&latlong=${center.lat()},${center.lng()}&radius=${TICKETMASTER_RADIUS_KM}&unit=km&size=50&sort=date,asc&locale=${currentLang === 'es' ? 'es' : 'en-us'}`;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      const response = await fetch(url, { signal: controller.signal });
      clearTimeout(timeout);
      const data = await response.json();
      const events = (data._embedded?.events || []).map(e => {
        const venue = e._embedded?.venues?.[0] || {}, location = venue.location || {};
        const lat = parseFloat(location.latitude), lng = parseFloat(location.longitude);
        if (!lat || !lng) return null;
        return { id: 'tm_' + e.id, type: 'event', source: 'ticketmaster', title: e.name || 'Evento', date: e.dates?.start?.localDate || '', time: e.dates?.start?.localTime || '', venue: venue.name || '', city: venue.city?.name || '', lat, lng, url: e.url, description: e.info || e.pleaseNote || '' };
      }).filter(Boolean);
      resolve(events);
    } catch (err) { resolve([]); }
  });
}
function searchEventbritePromise() {
  return new Promise(async (resolve) => {
    if (!API_KEYS.apify || API_KEYS.apify === 'TU_APIFY_TOKEN_AQUI') return resolve([]);
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      const response = await fetch(`https://api.apify.com/v2/acts/xtracto~eventbrite-events/run-sync-get-dataset-items?token=${API_KEYS.apify}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ location: 'Guadalajara', dateRange: 'current_future', maxItems: 100, enrichDetail: true }),
        signal: controller.signal
      });
      clearTimeout(timeout);
      const data = await response.json();
      const events = (Array.isArray(data) ? data : []).map(e => {
        const lat = parseFloat(e.primary_venue?.latitude || e.latitude), lng = parseFloat(e.primary_venue?.longitude || e.longitude);
        if (!lat || !lng) return null;
        return { id: 'eb_' + (e.id || e.eid || Math.random()), type: 'event', source: 'eventbrite', title: e.name || 'Evento', date: e.start_date || '', time: e.start_time || '', venue: e.primary_venue?.name || '', city: e.primary_venue?.city || 'Guadalajara', lat, lng, url: e.url, description: e.summary || e.description || '' };
      }).filter(Boolean);
      resolve(events);
    } catch (err) { resolve([]); }
  });
}
function deduplicateEvents(events) {
  const seen = new Set();
  return events.filter(e => {
    const key = `${(e.title || '').toLowerCase().trim()}|${(e.venue || '').toLowerCase().trim()}`;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
}

   ============================================ */
function clearMarkers() {
  markers.forEach(m => { if (m._label) m._label.setMap(null); m.setMap(null); });
  markers = [];
}
function createMarkerSVG(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="52" viewBox="0 0 44 52"><defs><filter id="s" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1614" flood-opacity="0.25"/></filter></defs><path d="M22 2 C11 2 2 11 2 22 C2 36 22 50 22 50 C22 50 42 36 42 22 C42 11 33 2 22 2 Z" fill="${color}" stroke="white" stroke-width="3" filter="url(#s)"/><circle cx="22" cy="22" r="11" fill="white" fill-opacity="0.95"/></svg>`;
  return { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), scaledSize: new google.maps.Size(44, 52), anchor: new google.maps.Point(22, 50) };
}
function getPlaceCategory(place) {
  const types = place.types || [];
  for (const key of Object.keys(CATEGORIES)) if (types.includes(key)) return CATEGORIES[key];
  return CATEGORIES.tourist_attraction;
}
function getCategoryKey(place) {
  const types = place.types || [];
  for (const key of Object.keys(CATEGORIES)) if (types.includes(key)) return key;
  return 'tourist_attraction';
}
function renderMarkersForAll() {
  allEvents.forEach(event => {
    if (currentAudience !== 'all' && getAgeCategoryKey(event) !== currentAudience) return;
    const ageCat = categorizeEventByAge(event);
    addMarkerToMap({ lat: event.lat, lng: event.lng, icon: createMarkerSVG(ageCat.color), iconColor: ageCat.color, iconChar: ageCat.icon, title: event.title, payload: event, payloadType: 'event', id: event.id });
  });
  allPlaces.forEach(place => {
    if (!place.geometry?.location) return;
    const cat = getPlaceCategory(place);
    addMarkerToMap({ lat: place.geometry.location.lat(), lng: place.geometry.location.lng(), icon: createMarkerSVG(cat.color), iconColor: cat.color, iconChar: cat.icon, title: place.name, payload: place, payloadType: 'place', id: place.place_id });
  });
}
function addMarkerToMap({ lat, lng, icon, iconColor, iconChar, title, payload, payloadType, id }) {
  const marker = new google.maps.Marker({ position: { lat, lng }, map, icon, title, animation: google.maps.Animation.DROP });
  const label = new google.maps.OverlayView();
  label.onAdd = function() {
    const div = document.createElement('div');
    div.style.cssText = `position:absolute;transform:translate(-50%,-50%);pointer-events:none;color:${iconColor};font-family:'Material Symbols Rounded';font-size:20px;font-variation-settings:'FILL' 1,'wght' 500;line-height:1;`;
    div.textContent = iconChar;
    this.div = div;
    this.getPanes().overlayMouseTarget.appendChild(div);
  };
  label.draw = function() {
    const pos = this.getProjection().fromLatLngToDivPixel(new google.maps.LatLng(lat, lng));
    if (pos && this.div) { this.div.style.left = pos.x + 'px'; this.div.style.top = (pos.y - 4) + 'px'; }
  };
  label.onRemove = function() { if (this.div && this.div.parentNode) this.div.parentNode.removeChild(this.div); };
  label.setMap(map);
  marker._label = label; marker._payload = payload; marker._payloadType = payloadType;
  marker.addListener('click', () => {
    closeSubmenu();
    if (payloadType === 'event') showInfoWindowEvent(marker, payload);
    else showInfoWindowGoogle(marker, payload);
  });
  marker.placeId = id;
  markers.push(marker);
}

/* ============================================
   INFO WINDOWS
   ============================================ */
function showInfoWindowGoogle(marker, place) {
  const cat = getPlaceCategory(place);
  const ratingText = place.rating ? `${place.rating} (${place.user_ratings_total || 0})` : '';
  infoWindow.setContent(`<div style="padding:16px;max-width:260px;font-family:'Inter',sans-serif;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><div style="width:40px;height:40px;border-radius:12px;background:${cat.bg};color:${cat.color};display:grid;place-items:center;flex-shrink:0;"><span style="font-family:'Material Symbols Rounded';font-size:22px;font-variation-settings:'FILL' 1;">${cat.icon}</span></div><div style="flex:1;min-width:0;"><div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;line-height:1.2;color:#1A1614;">${place.name || t('noName')}</div></div></div><div style="font-size:12px;color:#57534E;line-height:1.5;margin-bottom:12px;font-weight:500;"><div style="display:flex;align-items:center;gap:6px;"><span style="font-family:'Material Symbols Rounded';font-size:14px;color:#A8A29E;">location_on</span>${place.vicinity || t('addressNA')}</div>${ratingText ? `<div style="display:flex;align-items:center;gap:6px;margin-top:2px;"><span style="font-family:'Material Symbols Rounded';font-size:14px;color:#F4A261;">star</span>${ratingText}</div>` : ''}</div><button onclick="showToast('info', '${t('viewMore')}')" style="width:100%;padding:11px;border:none;border-radius:10px;background:#E76F51;color:white;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;">${t('viewMore')}</button></div>`);
  infoWindow.open(map, marker);
}
function showInfoWindowEvent(marker, event) {
  const ageCat = categorizeEventByAge(event);
  const urlBtn = event.url
    ? `<a href="${event.url}" target="_blank" rel="noopener" style="display:block;width:100%;padding:11px;border:none;border-radius:10px;background:${ageCat.color};color:white;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;text-align:center;text-decoration:none;">${t('viewMore')}</a>`
    : `<button onclick="showToast('info', '${t('viewMore')}')" style="width:100%;padding:11px;border:none;border-radius:10px;background:${ageCat.color};color:white;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;">${t('viewMore')}</button>`;
  const dateStr = event.date || '';
  const timeStr = event.time ? ' · ' + event.time : '';
  const venueStr = event.venue ? event.venue + (event.city ? ', ' + event.city : '') : t('addressNA');
  infoWindow.setContent(`<div style="padding:16px;max-width:280px;font-family:'Inter',sans-serif;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><div style="width:40px;height:40px;border-radius:12px;background:${ageCat.bg};color:${ageCat.color};display:grid;place-items:center;flex-shrink:0;"><span style="font-family:'Material Symbols Rounded';font-size:22px;font-variation-settings:'FILL' 1;">${ageCat.icon}</span></div><div style="flex:1;min-width:0;"><div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;line-height:1.2;color:#1A1614;">${event.title || 'Evento'}</div><div style="font-size:11px;font-weight:700;color:${ageCat.color};margin-top:2px;">${tAge(getAgeCategoryKey(event))}</div></div></div><div style="font-size:12px;color:#57534E;line-height:1.5;margin-bottom:12px;font-weight:500;"><div style="display:flex;align-items:center;gap:6px;"><span style="font-family:'Material Symbols Rounded';font-size:14px;color:#A8A29E;">location_on</span>${venueStr}</div>${dateStr ? `<div style="display:flex;align-items:center;gap:6px;margin-top:2px;"><span style="font-family:'Material Symbols Rounded';font-size:14px;color:#A8A29E;">calendar_today</span>${dateStr}${timeStr}</div>` : ''}</div>${urlBtn}</div>`);
  infoWindow.open(map, marker);
}

/* ============================================
   TARJETAS
   ============================================ */
function renderGoogleCard(place) {
  const cat = getPlaceCategory(place);
  const rating = place.rating ? `<span class="event-rating"><span class="ms fill">star</span>${place.rating}</span>` : '';
  return `<div class="event-card" onclick="focusPlace('${place.place_id}')" style="--card-color:${cat.color};--card-bg:${cat.bg};"><div class="event-icon-box"><span class="ms">${cat.icon}</span></div><div class="event-body"><div class="event-title">${place.name || t('noName')}</div><div class="event-venue"><span class="ms">location_on</span>${place.vicinity || t('addressNA')}</div><div class="event-footer"><span class="event-age-tag" style="--age-bg:${cat.bg};--age-color:${cat.color};">${tCat(getCategoryKey(place))}</span>${rating}</div></div></div>`;
}
function renderEventCard(event) {
  const ageCat = categorizeEventByAge(event);
  const ageKey = getAgeCategoryKey(event);
  const title = event.title || 'Evento sin título';
  const venue = event.venue ? event.venue + (event.city ? ', ' + event.city : '') : t('addressNA');
  const dateInfo = event.date ? event.date + (event.time ? ' · ' + event.time : '') : '';
  return `<div class="event-card" onclick="focusPlace('${event.id}')" style="--card-color:${ageCat.color};--card-bg:${ageCat.bg};"><div class="event-icon-box" style="background:${ageCat.bg};color:${ageCat.color};"><span class="ms">${ageCat.icon}</span></div><div class="event-body"><div class="event-title">${title}</div><div class="event-venue"><span class="ms">location_on</span>${venue}</div><div class="event-footer"><span class="event-age-tag" style="--age-bg:${ageCat.bg};--age-color:${ageCat.color};"><span class="ms">${ageCat.icon}</span>${tAge(ageKey)}</span>${dateInfo ? `<span class="event-rating"><span class="ms">calendar_today</span>${dateInfo}</span>` : ''}</div></div></div>`;
}
function renderUnifiedList() {
  const container = document.getElementById('sidebarEvents');
  if (unifiedResults.length === 0) {
    const msg = !placesApiAvailable ? 'Google Places no disponible.' : t('noResultsHint');
    container.innerHTML = `<div class="empty-state"><span class="ms">search_off</span><h3>${t('noResults')}</h3><p>${msg}</p></div>`;
    return;
  }
  const audienceLabel = currentAudience === 'all' ? t('age_all') : tAge(currentAudience);
  const label = `${unifiedResults.length} resultados · ${audienceLabel}`;
  container.innerHTML = `<div class="section-label">${label}</div>` + unifiedResults.map(item => item.type === 'event' ? renderEventCard(item) : renderGoogleCard(item)).join('');
}

/* ============================================
   SUBMENÚ
   ============================================ */
function openSubmenu(type) {
  const submenu = document.getElementById('submenu');
  const optionsContainer = document.getElementById('submenuOptions');
  const titleEl = document.getElementById('submenuTitle');
  const iconEl = document.getElementById('submenuIcon');

  let options = [];
  let title = '';
  let icon = '';

  if (type === 'audience') {
    title = t('audienceLabel'); icon = 'groups';
    options = Object.entries(AGE_CATEGORIES).map(([key, cat]) => ({
      key, label: tAge(key), icon: cat.icon, color: cat.color, bg: cat.bg, active: key === currentAudience, action: () => setAudience(key)
    }));
  } else if (type === 'category') {
    title = t('categoriesLabel'); icon = 'category';
    options = Object.entries(CATEGORIES).map(([key, cat]) => ({
      key, label: tCat(key), icon: cat.icon, color: cat.color, bg: cat.bg, active: key === currentCategory, action: () => setCategory(key)
    }));
  }

  titleEl.textContent = title;
  iconEl.textContent = icon;
  const firstOption = options.find(o => o.active) || options[0];
  submenu.style.setProperty('--submenu-color', firstOption.color);

  optionsContainer.innerHTML = options.map((opt, i) => `
    <button class="submenu-option ${opt.active ? 'active' : ''}" data-key="${opt.key}" style="--option-color:${opt.color};--option-bg:${opt.bg};animation-delay:${i * 30}ms;">
      <span class="ms">${opt.icon}</span><span>${opt.label}</span><span class="ms check">check</span>
    </button>
  `).join('');

  optionsContainer.querySelectorAll('.submenu-option').forEach((btn, i) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      options[i].action();
      closeSubmenu();
    });
  });

  submenu.classList.add('open');
}
function closeSubmenu() {
  document.getElementById('submenu').classList.remove('open');
}

/* ============================================
   BOTONES DE CATEGORÍA
   ============================================ */
function renderMainCategories() {
  const container = document.getElementById('mainCategories');
  container.innerHTML = `
    <button class="cat-btn" data-type="audience" onclick="event.stopPropagation(); openSubmenu('audience')" data-label="${t('audienceLabel')}">
      <span class="ms fill" id="audienceIcon">${AGE_CATEGORIES[currentAudience].icon}</span>
      <span class="badge" id="audienceBadge">0</span>
    </button>
    <button class="cat-btn" data-type="category" onclick="event.stopPropagation(); openSubmenu('category')" data-label="${t('categoriesLabel')}">
      <span class="ms fill" id="categoryIcon">${CATEGORIES[currentCategory].icon}</span>
      <span class="badge" id="categoryBadge">0</span>
    </button>
  `;
}

/* ============================================
   ACCIONES
   ============================================ */
function focusPlace(id) {
  const marker = markers.find(m => m.placeId === id);
  if (marker) {
    map.panTo(marker.getPosition());
    map.setZoom(16);
    setTimeout(() => google.maps.event.trigger(marker, 'click'), 500);
    if (!isDesktop()) closeSidebar();
  }
}
function setAudience(audience) {
  currentAudience = audience;
  applyFilters();
  updateBadges();
  const icon = document.getElementById('audienceIcon');
  if (icon) icon.textContent = AGE_CATEGORIES[audience].icon;
  showToast(AGE_CATEGORIES[audience].icon, tAge(audience));
}
function setCategory(cat) {
  currentCategory = cat;
  currentSearch = '';
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';
  const icon = document.getElementById('categoryIcon');
  if (icon) icon.textContent = CATEGORIES[cat].icon;
  lastSearchTime = 0;
  searchEverything();
  showToast(CATEGORIES[cat].icon, tCat(cat));
}

/* ============================================
   SIDEBAR — CON CIERRE AUTOMÁTICO
   ============================================ */
function isDesktop() { return window.innerWidth >= 1200; }
function isSidebarOpen() { return document.getElementById('sidebar').classList.contains('open'); }

function updateSidebarState() {
  const sidebar = document.getElementById('sidebar'), menuIcon = document.getElementById('menuIcon');
  if (isDesktop()) {
    if (document.body.classList.contains('sidebar-closed')) { sidebar.classList.remove('open'); menuIcon.textContent = 'menu'; }
    else { sidebar.classList.add('open'); menuIcon.textContent = 'menu_open'; }
  } else {
    menuIcon.textContent = sidebar.classList.contains('open') ? 'menu_open' : 'menu';
  }
}
function toggleSidebar() {
  if (isDesktop()) { document.body.classList.toggle('sidebar-closed'); updateSidebarState(); }
  else { isSidebarOpen() ? closeSidebar() : openSidebar(); }
}
function openSidebar() { document.getElementById('sidebar').classList.add('open'); updateSidebarState(); updateOverlay(); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); updateSidebarState(); updateOverlay(); }

function updateOverlay() {
  const sidebarOpen = isSidebarOpen() && !isDesktop();
  document.getElementById('overlay').classList.toggle('show', sidebarOpen);
}
function handleOverlayClick() { closeSidebar(); closeSubmenu(); }

/* ============================================
   MENÚ DE OPCIONES
   ============================================ */
function toggleOptionsMenu(e) {
  if (e) e.stopPropagation();
  openSubmenu('category');
}

/* ============================================
   PREFERENCIAS
   ============================================ */
function loadPreferences() {
  const savedLang = localStorage.getItem('gdl-lang');
  currentLang = (savedLang && TRANSLATIONS[savedLang]) ? savedLang : ((navigator.language || 'es').startsWith('en') ? 'en' : 'es');
  currentTheme = localStorage.getItem('gdl-theme') || 'light';
  applyTheme(currentTheme);
}
function savePreferences() { localStorage.setItem('gdl-lang', currentLang); localStorage.setItem('gdl-theme', currentTheme); }

/* ============================================
   TEMA
   ============================================ */
function applyTheme(theme) {
  let effective = theme;
  if (theme === 'auto') effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', effective);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.textContent = effective === 'dark' ? 'light_mode' : 'dark_mode';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = effective === 'dark' ? '#121212' : '#E76F51';
  if (map) map.setOptions({ styles: effective === 'dark' ? MAP_STYLES.dark : MAP_STYLES.light });
}
function setTheme(theme) {
  currentTheme = theme; applyTheme(theme); savePreferences();
  showToast('palette', theme === 'dark' ? 'Oscuro' : 'Claro');
}
function toggleTheme() {
  const effective = document.documentElement.getAttribute('data-theme');
  setTheme(effective === 'dark' ? 'light' : 'dark');
}

/* ============================================
   IDIOMA
   ============================================ */
function setLanguage(lang) {
  if (!TRANSLATIONS[lang] || lang === currentLang) return;
  currentLang = lang; savePreferences(); updateAllTranslations();
  renderMainCategories();
  updateLangSelector();
  applyFilters();
}
function updateLangSelector() {
  document.querySelectorAll('.lang-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.lang === currentLang);
  });
}
function updateAllTranslations() {
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'es-MX';
  document.title = currentLang === 'en' ? 'GDL Cultural — Museums & Events' : 'GDL Cultural — Museos y Eventos';
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  set('brandTitle', t('brandTitle'));
  set('brandSubtitle', t('brandSubtitle'));
  set('gpsLabel', isTracking ? t('gpsTracking') : t('gpsButton'));
  set('searchPlaceholder', t('searchPlaceholder'));
  set('installBannerTitle', currentLang === 'en' ? 'Install GDL Cultural' : 'Instala GDL Cultural');
  set('installBannerSubtitle', currentLang === 'en' ? 'Quick access from your home screen' : 'Accede rápido desde tu pantalla de inicio');
  set('installBannerBtn', currentLang === 'en' ? 'Install' : 'Instalar');
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.placeholder = t('searchInputPlaceholder');
}

/* ============================================
   UBICACIÓN
   ============================================ */
function searchNearMe() {
  if (!navigator.geolocation) return showToast('error', t('geoNotAvailable'));
  if (isTracking) { stopTracking(); return; }
  showToast('location_searching', t('locationSearching'));
  navigator.geolocation.getCurrentPosition(pos => {
    const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    map.panTo(loc); map.setZoom(14); updateUserMarker(loc);
    showToast('check_circle', t('locationFound'));
    lastSearchTime = 0;
    setTimeout(searchEverything, 500);
  }, () => showToast('error', t('locationError')), { enableHighAccuracy: true, timeout: 10000 });
}
function stopTracking() {
  isTracking = false;
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  document.getElementById('gpsButtonSidebar').classList.remove('tracking');
  document.getElementById('gpsLabel').textContent = t('gpsButton');
  if (userMarker) { userMarker.setMap(null); userMarker = null; }
  showToast('location_off', t('locationTrackingStop'));
}
function updateUserMarker(loc) {
  if (userMarker) userMarker.setPosition(loc);
  else {
    userMarker = new google.maps.Marker({ position: loc, map, icon: { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="#E76F51" stroke="white" stroke-width="3"/></svg>`), scaledSize: new google.maps.Size(22, 22), anchor: new google.maps.Point(11, 11) }, title: 'Tu ubicación', zIndex: 9999 });
  }
}

/* ============================================
   BÚSQUEDA POR TEXTO
   ============================================ */
function onSearchInput() {
  currentSearch = document.getElementById('searchInput').value.trim();
  if (!currentSearch) { applyFilters(); return; }
  const q = currentSearch.toLowerCase();
  const filtered = unifiedResults.filter(item => {
    const title = (item.title || item.name || '').toLowerCase();
    const venue = (item.venue || item.vicinity || '').toLowerCase();
    return title.includes(q) || venue.includes(q);
  });
  const container = document.getElementById('sidebarEvents');
  if (filtered.length === 0) { container.innerHTML = `<div class="empty-state"><span class="ms">search_off</span><h3>${t('noResults')}</h3></div>`; return; }
  container.innerHTML = `<div class="section-label">${filtered.length} resultados</div>` + filtered.map(item => item.type === 'event' ? renderEventCard(item) : renderGoogleCard(item)).join('');
}

/* ============================================
   PWA — INSTALACIÓN
   ============================================ */
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  isPWAInstalled = true;
}

// Sistema de cola para el banner (no se encima con toasts)
let bannerTimer = null;
function showInstallBanner() {
  if (isPWAInstalled) return;
  if (!shouldShowInstallBanner()) return;
  // Ocultar si hay toasts activos
  if (toastActive > 0) {
    setTimeout(showInstallBanner, 1500);
    return;
  }
  document.getElementById('installBanner').classList.add('show');
}

function hideInstallBanner() {
  document.getElementById('installBanner').classList.remove('show');
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('✅ beforeinstallprompt capturado');
  if (!isPWAInstalled) {
    bannerTimer = setTimeout(showInstallBanner, 2500);
  }
});

async function installPWA() {
  if (isPWAInstalled) { dismissInstallBanner(); return; }
  if (deferredPrompt) {
    try {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        showToast('check_circle', t('pwaInstalled'));
      } else {
        showToast('info', currentLang === 'en' ? 'You can install later from the menu' : 'Puedes instalar después desde el menú');
      }
      deferredPrompt = null;
      hideInstallBanner();
    } catch (err) {
      console.error('Error al instalar PWA:', err);
      showToast('error', t('pwaInstallFallback'));
    }
  } else {
    showToast('info', t('pwaInstallFallback'));
  }
}

function dismissInstallBanner() {
  hideInstallBanner();
  localStorage.setItem('gdl-install-dismissed', Date.now().toString());
}

function shouldShowInstallBanner() {
  const dismissed = localStorage.getItem('gdl-install-dismissed');
  if (!dismissed) return true;
  const daysSinceDismissed = (Date.now() - parseInt(dismissed)) / (1000 * 60 * 60 * 24);
  return daysSinceDismissed > 7;
}

window.addEventListener('appinstalled', () => {
  console.log('✅ PWA instalada');
  isPWAInstalled = true;
  deferredPrompt = null;
  hideInstallBanner();
  showToast('check_circle', t('pwaInstalled'));
});

/* ============================================
   SERVICE WORKER
   ============================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('✅ SW registrado:', reg.scope))
      .catch(err => console.log('⚠️ SW error:', err));
  });
}

document.addEventListener('DOMContentLoaded', () => {
  updateSidebarState();
  checkIfPWAInstalled();
});
window.addEventListener('resize', () => { updateSidebarState(); updateOverlay(); });
</script>

})();
</script>
